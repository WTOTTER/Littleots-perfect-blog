name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [ main ] # 当你把代码推送到 main 分支时，自动触发这个脚本

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Astro Project
        run: npm run build

      - name: Deploy to Target Repository
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GH_TOKEN }} # 调用你埋好的钥匙
          repository-name: WTOTTER/WTOTTER.github.io # 🔴 轰炸目标：直接覆盖掉原本的 Hexo 仓库
          branch: main # 轰进主仓库的 main 分支
          folder: dist # 把 Astro 编译出来的网页扔过去
          clean: true # 清理掉旧文件